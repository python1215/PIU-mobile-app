<!-- Advanced Dynamic Filtering Form -->
<div class="bg-white rounded-lg shadow-sm border p-6 mb-6" id="advanced-filter-form" style="display: none;">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
            <svg class="w-5 h-5 mr-2 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z" clip-rule="evenodd"></path>
            </svg>
            Advanced Filtering
        </h3>
        <button type="button" class="text-gray-400 hover:text-gray-600" onclick="toggleAdvancedFilter()">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
        </button>
    </div>

    <form method="get" class="space-y-6">
        <!-- Quick Filter Presets -->
        <div class="bg-blue-50 rounded-lg p-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Quick Filters</label>
            <select name="quick_filter" class="form-select w-full" onchange="applyQuickFilter(this.value)">
                <option value="">Choose a preset filter...</option>
                <option value="active_contracts">Active Contracts (Currently running)</option>
                <option value="completed_contracts">Completed Contracts</option>
                <option value="high_value_contracts">High Value Contracts (>1M)</option>
                <option value="recent_contracts">Recent Contracts (Last 30 days)</option>
                <option value="amended_contracts">Contracts with Amendments</option>
            </select>
        </div>

        <!-- Custom Filter Builder -->
        <div class="border-t pt-4">
            <h4 class="text-md font-medium text-gray-800 mb-4">Custom Filter Builder</h4>
            <p class="text-sm text-gray-600 mb-4">Select the fields you want to filter by and combine multiple criteria as needed.</p>

            <!-- Filter Row 1 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 p-4 bg-gray-50 rounded-lg" id="filter-row-1">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Field</label>
                    <select name="filter_field_1" class="form-select w-full" onchange="updateOperators(1, this.value)">
                        <option value="">Select field to filter...</option>
                        <option value="contract_refNo">Contract Reference</option>
                        <option value="name_of_contractor">Contractor Name</option>
                        <option value="name_of_consultant">Consultant Name</option>
                        <option value="projectID">Project</option>
                        <option value="compID">Component</option>
                        <option value="subcompID">Subcomponent</option>
                        <option value="activityID">Activity</option>
                        <option value="project_Category">Project Category</option>
                        <option value="funding_source">Funding Source</option>
                        <option value="contract_start_date">Start Date</option>
                        <option value="contract_end_date">End Date</option>
                        <option value="contract_value">Contract Value</option>
                        <option value="location_of_investment">Location</option>
                        <option value="amendments">Has Amendments</option>
                        <option value="duration">Duration</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Condition</label>
                    <select name="filter_operator_1" class="form-select w-full" id="operator-1">
                        <option value="">Select condition...</option>
                        <option value="exact">Equals</option>
                        <option value="icontains">Contains</option>
                        <option value="startswith">Starts with</option>
                        <option value="endswith">Ends with</option>
                        <option value="gt">Greater than</option>
                        <option value="gte">Greater than or equal</option>
                        <option value="lt">Less than</option>
                        <option value="lte">Less than or equal</option>
                        <option value="range">Between (comma separated)</option>
                        <option value="in">In list (comma separated)</option>
                        <option value="isnull">Is empty</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Value</label>
                    <input type="text" name="filter_value_1" class="form-control w-full" placeholder="Enter filter value..." id="value-1">
                    <div class="text-xs text-gray-500 mt-1" id="help-1"></div>
                </div>
                <div class="flex items-end">
                    <button type="button" class="px-3 py-2 text-red-600 hover:bg-red-50 rounded-lg" onclick="clearFilterRow(1)">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Logical Operator 1-2 -->
            <div class="flex justify-center mb-4" id="logical-1-2" style="display: none;">
                <select name="logical_operator_1_2" class="form-select w-32">
                    <option value="AND">AND</option>
                    <option value="OR">OR</option>
                </select>
            </div>

            <!-- Filter Row 2 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 p-4 bg-gray-50 rounded-lg" id="filter-row-2" style="display: none;">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Field</label>
                    <select name="filter_field_2" class="form-select w-full" onchange="updateOperators(2, this.value)">
                        <option value="">Select field to filter...</option>
                        <option value="contract_refNo">Contract Reference</option>
                        <option value="name_of_contractor">Contractor Name</option>
                        <option value="name_of_consultant">Consultant Name</option>
                        <option value="projectID">Project</option>
                        <option value="compID">Component</option>
                        <option value="subcompID">Subcomponent</option>
                        <option value="activityID">Activity</option>
                        <option value="project_Category">Project Category</option>
                        <option value="funding_source">Funding Source</option>
                        <option value="contract_start_date">Start Date</option>
                        <option value="contract_end_date">End Date</option>
                        <option value="contract_value">Contract Value</option>
                        <option value="location_of_investment">Location</option>
                        <option value="amendments">Has Amendments</option>
                        <option value="duration">Duration</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Condition</label>
                    <select name="filter_operator_2" class="form-select w-full" id="operator-2">
                        <option value="">Select condition...</option>
                        <option value="exact">Equals</option>
                        <option value="icontains">Contains</option>
                        <option value="startswith">Starts with</option>
                        <option value="endswith">Ends with</option>
                        <option value="gt">Greater than</option>
                        <option value="gte">Greater than or equal</option>
                        <option value="lt">Less than</option>
                        <option value="lte">Less than or equal</option>
                        <option value="range">Between (comma separated)</option>
                        <option value="in">In list (comma separated)</option>
                        <option value="isnull">Is empty</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Value</label>
                    <input type="text" name="filter_value_2" class="form-control w-full" placeholder="Enter filter value..." id="value-2">
                    <div class="text-xs text-gray-500 mt-1" id="help-2"></div>
                </div>
                <div class="flex items-end">
                    <button type="button" class="px-3 py-2 text-red-600 hover:bg-red-50 rounded-lg" onclick="clearFilterRow(2)">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Logical Operator 2-3 -->
            <div class="flex justify-center mb-4" id="logical-2-3" style="display: none;">
                <select name="logical_operator_2_3" class="form-select w-32">
                    <option value="AND">AND</option>
                    <option value="OR">OR</option>
                </select>
            </div>

            <!-- Filter Row 3 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 p-4 bg-gray-50 rounded-lg" id="filter-row-3" style="display: none;">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Field</label>
                    <select name="filter_field_3" class="form-select w-full" onchange="updateOperators(3, this.value)">
                        <option value="">Select field to filter...</option>
                        <option value="contract_refNo">Contract Reference</option>
                        <option value="name_of_contractor">Contractor Name</option>
                        <option value="name_of_consultant">Consultant Name</option>
                        <option value="projectID">Project</option>
                        <option value="compID">Component</option>
                        <option value="subcompID">Subcomponent</option>
                        <option value="activityID">Activity</option>
                        <option value="project_Category">Project Category</option>
                        <option value="funding_source">Funding Source</option>
                        <option value="contract_start_date">Start Date</option>
                        <option value="contract_end_date">End Date</option>
                        <option value="contract_value">Contract Value</option>
                        <option value="location_of_investment">Location</option>
                        <option value="amendments">Has Amendments</option>
                        <option value="duration">Duration</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Condition</label>
                    <select name="filter_operator_3" class="form-select w-full" id="operator-3">
                        <option value="">Select condition...</option>
                        <option value="exact">Equals</option>
                        <option value="icontains">Contains</option>
                        <option value="startswith">Starts with</option>

                        <option value="gte">Greater than or equal</option>
                        <option value="lt">Less than</option>

                    </select>

                    <label class="block text-sm font-medium text-gray-700 mb-1">Value</label>
                    <input type="text" name="filter_value_3" class="form-control w-full" placeholder="Enter filter value..." id="value-3">
                    <div class="text-xs text-gray-500 mt-1" id="help-3"></div>
                </div>
                <div class="flex items-end">
                    <button type="button" class="px-3 py-2 text-red-600 hover:bg-red-50 rounded-lg" onclick="clearFilterRow(3)">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>

            <!-- Add More Filters Button -->
            <div class="flex justify-center mb-4">
                <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors" onclick="addFilterRow()" id="add-filter-btn">
                    <svg class="w-4 h-4 inline mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"></path>
                    </svg>
                    Add Another Filter
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-between items-center pt-4 border-t">
            <button type="button" class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors" onclick="clearAllFilters()">
                Clear All Filters
            </button>
            <div class="space-x-3">
                <button type="button" class="px-4 py-2 text-gray-600 border rounded-lg hover:bg-gray-50 transition-colors" onclick="toggleAdvancedFilter()">
                    Cancel
                </button>
                <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                    Apply Filters
                </button>
            </div>
        </div>
    </form>
</div>

<script>
let activeFilters = 1;

function toggleAdvancedFilter() {
    const form = document.getElementById('advanced-filter-form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

function addFilterRow() {
    if (activeFilters < 3) {
        activeFilters++;
        document.getElementById(`filter-row-${activeFilters}`).style.display = 'grid';
        
        if (activeFilters > 1) {
            document.getElementById(`logical-${activeFilters-1}-${activeFilters}`).style.display = 'flex';
        }
        
        if (activeFilters === 3) {
            document.getElementById('add-filter-btn').style.display = 'none';
        }
    }
}

function clearFilterRow(rowNum) {
    document.querySelector(`select[name="filter_field_${rowNum}"]`).value = '';
    document.querySelector(`select[name="filter_operator_${rowNum}"]`).value = '';
    document.querySelector(`input[name="filter_value_${rowNum}"]`).value = '';
    
    // Hide logical operators if this was the last active filter
    if (rowNum === activeFilters && activeFilters > 1) {
        document.getElementById(`logical-${rowNum-1}-${rowNum}`).style.display = 'none';
        document.getElementById(`filter-row-${rowNum}`).style.display = 'none';
        activeFilters--;
        document.getElementById('add-filter-btn').style.display = 'block';
    }
}

function clearAllFilters() {
    for (let i = 1; i <= 3; i++) {
        document.querySelector(`select[name="filter_field_${i}"]`).value = '';
        document.querySelector(`select[name="filter_operator_${i}"]`).value = '';
        document.querySelector(`input[name="filter_value_${i}"]`).value = '';
        
        if (i > 1) {
            document.getElementById(`filter-row-${i}`).style.display = 'none';
            document.getElementById(`logical-${i-1}-${i}`).style.display = 'none';
        }
    }
    document.querySelector('select[name="quick_filter"]').value = '';
    activeFilters = 1;
    document.getElementById('add-filter-btn').style.display = 'block';
}

function updateOperators(rowNum, fieldType) {
    const operatorSelect = document.getElementById(`operator-${rowNum}`);
    const helpDiv = document.getElementById(`help-${rowNum}`);
    
    // Update available operators based on field type
    if (fieldType.includes('date')) {
        helpDiv.innerHTML = 'Format: YYYY-MM-DD or use "range" with: 2024-01-01,2024-12-31';
    } else if (fieldType.includes('value') || fieldType.includes('Value')) {
        helpDiv.innerHTML = 'Enter numeric value. Use "range" with: 1000,50000';
    } else if (fieldType === 'amendments') {
        helpDiv.innerHTML = 'Enter: true/false or yes/no';
    } else {
        helpDiv.innerHTML = 'Enter text value. Use "in" for multiple: item1,item2,item3';
    }
}

function applyQuickFilter(value) {
    if (value) {
        // Clear custom filters when quick filter is selected
        clearAllFilters();
    }
}
</script>
