{% extends 'social_and_env/base.html' %}
{% load widget_tweaks %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i>{{ title }}
                    </h5>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        
                        <div class="row">
                            <!-- Complainant Information -->
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="name_of_complainant" class="form-label">
                                        Name of Complainant <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="name_of_complainant" 
                                           name="name_of_complainant" required
                                           value="{% if grievance_data %}{{ grievance_data.name_of_complainant|default:'' }}{% endif %}">
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="sex" class="form-label">Gender</label>
                                    <select class="form-select" id="sex" name="sex">
                                        <option value="">Select Gender</option>
                                        <option value="M" {% if grievance_data.sex == 'M' %}selected{% endif %}>Male</option>
                                        <option value="F" {% if grievance_data.sex == 'F' %}selected{% endif %}>Female</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="phone_number" class="form-label">Phone Number</label>
                                    <input type="text" class="form-control" id="phone_number" 
                                           name="phone_number"
                                           value="{% if grievance_data %}{{ grievance_data.phone_number|default:'' }}{% endif %}">
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="location" class="form-label">Location</label>
                                    <input type="text" class="form-control" id="location" 
                                           name="location"
                                           value="{% if grievance_data %}{{ grievance_data.location|default:'' }}{% endif %}">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Complaint Details -->
                        <div class="mb-3">
                            <label for="complaint_category" class="form-label">Complaint Category</label>
                            <input type="text" class="form-control" id="complaint_category" 
                                   name="complaint_category"
                                   value="{% if grievance_data %}{{ grievance_data.complaint_category|default:'' }}{% endif %}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="description_of_complaint" class="form-label">
                                Description of Complaint <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" id="description_of_complaint" 
                                      name="description_of_complaint" rows="4" required>{% if grievance_data %}{{ grievance_data.description_of_complaint|default:'' }}{% endif %}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="responsible_unit_or_department" class="form-label">Responsible Unit/Department</label>
                            <input type="text" class="form-control" id="responsible_unit_or_department" 
                                   name="responsible_unit_or_department"
                                   value="{% if grievance_data %}{{ grievance_data.responsible_unit_or_department|default:'' }}{% endif %}">
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="date_claim_recieved" class="form-label">Date Claim Received</label>
                                    <input type="date" class="form-control" id="date_claim_recieved" 
                                           name="date_claim_recieved"
                                           value="{% if grievance_data and grievance_data.date_claim_recieved %}{{ grievance_data.date_claim_recieved|date:'Y-m-d' }}{% endif %}">
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="expected_decision_date" class="form-label">Expected Decision Date</label>
                                    <input type="date" class="form-control" id="expected_decision_date" 
                                           name="expected_decision_date"
                                           value="{% if grievance_data and grievance_data.expected_decision_date %}{{ grievance_data.expected_decision_date|date:'Y-m-d' }}{% endif %}">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="was_complainant_satisfied_with_decision" class="form-label">Complainant Satisfied with Decision</label>
                            <select class="form-select" id="was_complainant_satisfied_with_decision" 
                                    name="was_complainant_satisfied_with_decision">
                                <option value="">Select Satisfaction Level</option>
                                <option value="Y" {% if grievance_data.was_complainant_satisfied_with_decision == 'Y' %}selected{% endif %}>Yes</option>
                                <option value="N" {% if grievance_data.was_complainant_satisfied_with_decision == 'N' %}selected{% endif %}>No</option>
                                <option value="Pending" {% if grievance_data.was_complainant_satisfied_with_decision == 'Pending' %}selected{% endif %}>Pending</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="outcome_of_grievance" class="form-label">Outcome of Grievance</label>
                            <textarea class="form-control" id="outcome_of_grievance" 
                                      name="outcome_of_grievance" rows="3">{% if grievance_data %}{{ grievance_data.outcome_of_grievance|default:'' }}{% endif %}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'grievance_list' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>Save Grievance Case
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
