{% extends 'social_and_env/base.html' %}
{% load widget_tweaks %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i>{{ title }}
                    </h5>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        
                        <div class="row">
                            <!-- Complainant Information -->
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="name_of_complainant" class="form-label">
                                        Name of Complainant <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="name_of_complainant" 
                                           name="name_of_complainant" required
                                           value="{% if grievance_data %}{{ grievance_data.name_of_complainant|default:'' }}{% endif %}">
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="sex" class="form-label">Gender</label>
                                    <select class="form-select" id="sex" name="sex">
                                        <option value="">Select Gender</option>
                                        <option value="M" {% if grievance_data.sex == 'M' %}selected{% endif %}>Male</option>
                                        <option value="F" {% if grievance_data.sex == 'F' %}selected{% endif %}>Female</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="tell_no" class="form-label">Phone Number</label>
                                    <input type="text" class="form-control" id="tell_no" 
                                           name="tell_no"
                                           value="{% if grievance_data %}{{ grievance_data.tell_no|default:'' }}{% endif %}">
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="name_of_person_receiving_complaint" class="form-label">Person Receiving Complaint</label>
                                    <input type="text" class="form-control" id="name_of_person_receiving_complaint" 
                                           name="name_of_person_receiving_complaint"
                                           value="{% if grievance_data %}{{ grievance_data.name_of_person_receiving_complaint|default:'' }}{% endif %}">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Complaint Details -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="how_complaint_was_received" class="form-label">How Complaint was Received</label>
                                    <select class="form-select" id="how_complaint_was_received" name="how_complaint_was_received">
                                        <option value="">Select Method</option>
                                        <option value="Call" {% if grievance_data.how_complaint_was_received == 'Call' %}selected{% endif %}>Phone Call</option>
                                        <option value="Email" {% if grievance_data.how_complaint_was_received == 'Email' %}selected{% endif %}>Email</option>
                                        <option value="Letter" {% if grievance_data.how_complaint_was_received == 'Letter' %}selected{% endif %}>Letter</option>
                                        <option value="In Person" {% if grievance_data.how_complaint_was_received == 'In Person' %}selected{% endif %}>In Person</option>
                                        <option value="SMS" {% if grievance_data.how_complaint_was_received == 'SMS' %}selected{% endif %}>SMS</option>
                                        <option value="WhatsApp" {% if grievance_data.how_complaint_was_received == 'WhatsApp' %}selected{% endif %}>WhatsApp</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="project" class="form-label">Project <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="project" 
                                           name="project" required
                                           value="{% if grievance_data %}{{ grievance_data.project_id|default:'' }}{% endif %}"
                                           placeholder="Enter project ID">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="complaint_content" class="form-label">
                                Complaint Content <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" id="complaint_content" 
                                      name="complaint_content" rows="4" required>{% if grievance_data %}{{ grievance_data.complaint_content|default:'' }}{% endif %}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="was_recieved_of_complaint_ack" class="form-label">Complaint Acknowledgment Received</label>
                                    <select class="form-select" id="was_recieved_of_complaint_ack" name="was_recieved_of_complaint_ack">
                                        <option value="">Select</option>
                                        <option value="Y" {% if grievance_data.was_recieved_of_complaint_ack == 'Y' %}selected{% endif %}>Yes</option>
                                        <option value="N" {% if grievance_data.was_recieved_of_complaint_ack == 'N' %}selected{% endif %}>No</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="communication_method" class="form-label">Communication Method</label>
                                    <select class="form-select" id="communication_method" name="communication_method">
                                        <option value="">Select Method</option>
                                        <option value="Call" {% if grievance_data.communication_method == 'Call' %}selected{% endif %}>Phone Call</option>
                                        <option value="Email" {% if grievance_data.communication_method == 'Email' %}selected{% endif %}>Email</option>
                                        <option value="Letter" {% if grievance_data.communication_method == 'Letter' %}selected{% endif %}>Letter</option>
                                        <option value="In Person" {% if grievance_data.communication_method == 'In Person' %}selected{% endif %}>In Person</option>
                                        <option value="SMS" {% if grievance_data.communication_method == 'SMS' %}selected{% endif %}>SMS</option>
                                        <option value="WhatsApp" {% if grievance_data.communication_method == 'WhatsApp' %}selected{% endif %}>WhatsApp</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="date_claim_recieved" class="form-label">Date Claim Received</label>
                                    <input type="date" class="form-control" id="date_claim_recieved" 
                                           name="date_claim_recieved"
                                           value="{% if grievance_data and grievance_data.date_claim_recieved %}{{ grievance_data.date_claim_recieved|date:'Y-m-d' }}{% endif %}">
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="expected_decision_date" class="form-label">Expected Decision Date</label>
                                    <input type="date" class="form-control" id="expected_decision_date" 
                                           name="expected_decision_date"
                                           value="{% if grievance_data and grievance_data.expected_decision_date %}{{ grievance_data.expected_decision_date|date:'Y-m-d' }}{% endif %}">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="was_complainant_satisfied_with_decision" class="form-label">Complainant Satisfied with Decision</label>
                                    <select class="form-select" id="was_complainant_satisfied_with_decision" 
                                            name="was_complainant_satisfied_with_decision">
                                        <option value="">Select Satisfaction Level</option>
                                        <option value="Y" {% if grievance_data.was_complainant_satisfied_with_decision == 'Y' %}selected{% endif %}>Yes</option>
                                        <option value="N" {% if grievance_data.was_complainant_satisfied_with_decision == 'N' %}selected{% endif %}>No</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="was_decison_communicated_to_complainant" class="form-label">Decision Communicated to Complainant</label>
                                    <select class="form-select" id="was_decison_communicated_to_complainant" 
                                            name="was_decison_communicated_to_complainant">
                                        <option value="">Select</option>
                                        <option value="Y" {% if grievance_data.was_decison_communicated_to_complainant == 'Y' %}selected{% endif %}>Yes</option>
                                        <option value="N" {% if grievance_data.was_decison_communicated_to_complainant == 'N' %}selected{% endif %}>No</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="any_follow_up_action" class="form-label">Follow-up Actions</label>
                            <textarea class="form-control" id="any_follow_up_action" 
                                      name="any_follow_up_action" rows="3">{% if grievance_data %}{{ grievance_data.any_follow_up_action|default:'' }}{% endif %}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="brief_note_for_NO_answer" class="form-label">Explanation if Not Satisfied</label>
                            <textarea class="form-control" id="brief_note_for_NO_answer" 
                                      name="brief_note_for_NO_answer" rows="3">{% if grievance_data %}{{ grievance_data.brief_note_for_NO_answer|default:'' }}{% endif %}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="type_of_investment" class="form-label">Type of Investment</label>
                                    <input type="text" class="form-control" id="type_of_investment" 
                                           name="type_of_investment" 
                                           value="{% if grievance_data %}{{ grievance_data.type_of_investment_id|default:'' }}{% endif %}"
                                           placeholder="Enter investment type ID">
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="decision_outcome" class="form-label">Decision Outcome</label>
                                    <input type="text" class="form-control" id="decision_outcome" 
                                           name="decision_outcome" 
                                           value="{% if grievance_data %}{{ grievance_data.decision_outcome_id|default:'' }}{% endif %}"
                                           placeholder="Enter outcome ID">
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'grievance_list' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>Save Grievance Case
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
