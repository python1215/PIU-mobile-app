{% extends 'PIU_Mapping_project_Sites/base.html' %}

{% block title %}Project Site Mapping{% endblock %}

{% block mapping_content %}
<div class="container-fluid">
    <div class="row mb-3">
        <div class="col-12">
            <h2>Interactive Project Sites Map</h2>
            <p>Showing {{ total_communities }} project locations in The Gambia</p>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-9">
            <div id="map" style="height: 600px; width: 100%; border: 1px solid #ccc;"></div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">
                    <h6><i class="bi bi-layers"></i> Project Layers</h6>
                </div>
                <div class="card-body">
                    <div id="layer-controls">
                        <!-- Layer controls will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    .custom-pin-marker {
        background: transparent !important;
        border: none !important;
    }
    .pin-marker {
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .form-check-input:indeterminate {
        background-color: #6c757d;
        border-color: #6c757d;
    }
    .leaflet-div-icon {
        background: transparent;
        border: none;
    }
</style>

<script>
// Wait for DOM to be ready
document.addEventListener('DOMContentLoaded', function() {
    // Initialize map
    var map = L.map('map').setView([13.4667, -15.3100], 9);
    
    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);
    
    // Project data from Django
    var locations = {{ project_data_json|safe }};
    
    // Check URL parameters
    var urlParams = new URLSearchParams(window.location.search);
    var focusLat = urlParams.get('lat');
    var focusLng = urlParams.get('lng');
    var focusZoom = urlParams.get('zoom');
    var focusId = urlParams.get('mappingId');
    
    // If focusing on specific location, update map view
    if (focusLat && focusLng) {
        map.setView([parseFloat(focusLat), parseFloat(focusLng)], focusZoom ? parseInt(focusZoom) : 16);
    }
    
    // Project colors mapping
    var projectColors = {
        'ECOWAS Regional Electricity Access Project': '#2E7D32',
        'Gambia Electricity Restoration and Modernization Project': '#F57C00', 
        'Gambia Electricity Access Project': '#1976D2',
        'The Gambia Electricity System Rehabilitation and Expansion Project': '#D32F2F',
        'No Project': '#757575'
    };
    
    // Group locations by project
    var projectGroups = {};
    var allProjects = new Set();
    
    locations.forEach(function(location) {
        location.projects.forEach(function(project) {
            if (!projectGroups[project]) {
                projectGroups[project] = [];
            }
            projectGroups[project].push(location);
            allProjects.add(project);
        });
        
        // Handle locations with no projects
        if (location.projects.length === 0) {
            if (!projectGroups['No Project']) {
                projectGroups['No Project'] = [];
            }
            projectGroups['No Project'].push(location);
            allProjects.add('No Project');
        }
    });
    
    // Create layer groups for each project
    var layerGroups = {};
    var layerControls = document.getElementById('layer-controls');
    
    // Create "Select All" checkbox
    var selectAllDiv = document.createElement('div');
    selectAllDiv.className = 'form-check mb-2';
    selectAllDiv.innerHTML = `
        <input class="form-check-input" type="checkbox" id="select-all" checked>
        <label class="form-check-label fw-bold" for="select-all">
            <span style="color: #666;">All Projects</span>
        </label>
    `;
    layerControls.appendChild(selectAllDiv);
    
    // Add separator
    layerControls.appendChild(document.createElement('hr'));
    
    // Create checkboxes and markers for each project
    Array.from(allProjects).forEach(function(project) {
        var color = projectColors[project] || '#666666';
        layerGroups[project] = L.layerGroup().addTo(map);
        
        // Create project checkbox
        var projectDiv = document.createElement('div');
        projectDiv.className = 'form-check mb-2';
        
        var checkboxId = 'project-' + project.replace(/[^a-zA-Z0-9]/g, '-');
        
        projectDiv.innerHTML = `
            <input class="form-check-input project-checkbox" type="checkbox" id="${checkboxId}" checked data-project="${project}">
            <label class="form-check-label" for="${checkboxId}">
                <span style="color: ${color}; font-weight: bold;">●</span> ${project}
            </label>
        `;
        
        layerControls.appendChild(projectDiv);
        
        // Add markers for this project
        projectGroups[project].forEach(function(location) {
            // Create custom colored pin marker
            var customIcon = L.divIcon({
                className: 'custom-pin-marker',
                html: `
                    <div class="pin-marker" style="color: ${color};">
                        <svg width="25" height="41" viewBox="0 0 25 41" xmlns="http://www.w3.org/2000/svg">
                            <path fill="currentColor" stroke="#fff" stroke-width="1" 
                                  d="M12.5 0C5.596 0 0 5.596 0 12.5c0 8.13 12.5 28.5 12.5 28.5s12.5-20.37 12.5-28.5C25 5.596 19.404 0 12.5 0z"/>
                            <circle fill="#fff" cx="12.5" cy="12.5" r="4"/>
                        </svg>
                    </div>
                `,
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34]
            });
            
            var marker = L.marker([location.latitude, location.longitude], {
                icon: customIcon
            }).addTo(layerGroups[project]);
            
            var popupContent = '<div style="min-width: 250px; font-family: Arial, sans-serif;">';
            
            // Settlement name as title
            popupContent += '<div style="background: #f8f9fa; padding: 8px; margin: -8px -12px 12px -12px; border-bottom: 1px solid #dee2e6;">';
            popupContent += '<h6 style="margin: 0; font-weight: bold; color: #333;">' + location.settlement + '</h6>';
            if (focusId == location.id) {
                popupContent += '<small style="color: #ff4444; font-weight: bold;">📍 SELECTED LOCATION</small>';
            }
            popupContent += '</div>';
            
            // Project information
            popupContent += '<div style="margin-bottom: 8px;">';
            popupContent += '<strong style="color: #666; font-size: 12px;">Project:</strong><br>';
            popupContent += '<span style="color: ' + color + '; font-weight: bold; font-size: 14px;">' + project + '</span>';
            popupContent += '</div>';
            
            // Location details
            popupContent += '<div style="font-size: 13px; line-height: 1.4;">';
            popupContent += '<div style="margin-bottom: 4px;"><strong style="color: #666;">Region:</strong> ' + location.region + '</div>';
            popupContent += '<div style="margin-bottom: 4px;"><strong style="color: #666;">District:</strong> ' + location.district + '</div>';
            popupContent += '<div style="margin-bottom: 4px;"><strong style="color: #666;">Donor:</strong> World Bank</div>';
            
            // Household statistics
            popupContent += '<div style="margin-bottom: 4px;"><strong style="color: #666;">Households:</strong> ' + location.total_households + '</div>';
            popupContent += '<div style="margin-bottom: 4px;"><strong style="color: #666;">Connected:</strong> ' + location.connected_households + '</div>';
            
            // Access rate calculation
            var accessRate = location.total_households > 0 ? 
                ((location.connected_households / location.total_households) * 100).toFixed(1) : '0.0';
            popupContent += '<div style="margin-bottom: 4px;"><strong style="color: #666;">Access Rate:</strong> ' + accessRate + '%</div>';
            
            // Access type and year
            popupContent += '<div style="margin-bottom: 4px;"><strong style="color: #666;">Access Type:</strong> Electricity Only</div>';
            popupContent += '<div style="margin-bottom: 8px;"><strong style="color: #666;">Year:</strong> 2019</div>';
            
            // Coordinates
            popupContent += '<div style="font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 8px; margin-top: 8px;">';
            popupContent += '<strong>Coordinates:</strong> ' + location.latitude.toFixed(4) + ', ' + location.longitude.toFixed(4);
            popupContent += '</div>';
            
            popupContent += '</div>';
            
            marker.bindPopup(popupContent);
            
            // Auto-open popup for focused location
            if (focusId == location.id) {
                marker.openPopup();
            }
        });
    });
    
    // Handle individual project checkbox changes
    document.querySelectorAll('.project-checkbox').forEach(function(checkbox) {
        checkbox.addEventListener('change', function() {
            var project = this.dataset.project;
            if (this.checked) {
                map.addLayer(layerGroups[project]);
            } else {
                map.removeLayer(layerGroups[project]);
            }
            
            // Update "Select All" checkbox state
            updateSelectAllState();
        });
    });
    
    // Handle "Select All" checkbox
    document.getElementById('select-all').addEventListener('change', function() {
        var checked = this.checked;
        document.querySelectorAll('.project-checkbox').forEach(function(checkbox) {
            checkbox.checked = checked;
            var project = checkbox.dataset.project;
            if (checked) {
                map.addLayer(layerGroups[project]);
            } else {
                map.removeLayer(layerGroups[project]);
            }
        });
    });
    
    // Function to update "Select All" state
    function updateSelectAllState() {
        var allCheckboxes = document.querySelectorAll('.project-checkbox');
        var checkedCheckboxes = document.querySelectorAll('.project-checkbox:checked');
        var selectAllCheckbox = document.getElementById('select-all');
        
        if (checkedCheckboxes.length === 0) {
            selectAllCheckbox.indeterminate = false;
            selectAllCheckbox.checked = false;
        } else if (checkedCheckboxes.length === allCheckboxes.length) {
            selectAllCheckbox.indeterminate = false;
            selectAllCheckbox.checked = true;
        } else {
            selectAllCheckbox.indeterminate = true;
        }
    }
    
    console.log('Map loaded with', locations.length, 'locations');
});
</script>
{% endblock %}
