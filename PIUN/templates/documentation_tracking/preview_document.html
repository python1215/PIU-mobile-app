{% extends 'monitoring/base.html' %}

{% block monitoring_content %}
<div class="container-fluid" style="background-color: #f8f9fa; min-height: 100vh; padding-top: 20px; padding-bottom: 20px;">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-eye me-2"></i>Document Preview: {{ document.description }}
                    </h5>
                </div>
                <div class="card-body p-0">
                    <iframe src="{{ document.get_attachment_url }}" width="100%" height="600px" style="border:none;"></iframe>
                </div>
                <div class="card-footer">
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'document-list' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Back to List
                        </a>
                        <a href="{{ document.get_attachment_url }}" download class="btn btn-success">
                            <i class="bi bi-download me-1"></i>Download
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock monitoring_content %}
