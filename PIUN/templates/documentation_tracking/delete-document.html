<div class="mt-8 mb-4">
    <h1 class="text-2xl text-white">Delete Documentation</h1>
    
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative my-4">
        <strong class="font-bold">Warning!</strong>
        <span class="block sm:inline">Are you sure you want to delete this document?</span>
    </div>
    
    <div class="my-4">
        <p class="text-white"><strong>year:</strong> {{ document.project }}</p>
        <p class="text-white"><strong>year:</strong> {{ document.document_type }}</p>
        <p class="text-white"><strong>quarter:</strong> {{ document.description }}</p>
        <p class="text-white"><strong>project:</strong> {{ document.document_date }}</p>
        <p class="text-white"><strong>pdo:</strong> {{ document.attachment }}</p>                      
    </div>

    <div class="flex justify-end space-x-4 mt-6">
        <form hx-post="{% url 'delete-document' pk=document.pk %}" 
              hx-target="#document-block">
            {% csrf_token %}
            <button type="submit" class="px-6 py-2 bg-red-600 text-white hover:bg-red-700 rounded">
                Confirm Delete
            </button>
        </form>
        <button type="button" 
                class="px-6 py-2 bg-gray-600 text-white hover:bg-gray-700 rounded"
                hx-get="{% url 'list_documents' %}"
                hx-target="#document-block">
            Cancel
        </button>
    </div>
</div>
