{% extends 'monitoring/base.html' %}
{% load crispy_forms_tags %}

{% block monitoring_content %}
<div class="container-fluid" style="background-color: #f8f9fa; min-height: 100vh; padding-top: 20px; padding-bottom: 20px;">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-upload me-2"></i>Upload Document
                    </h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'document-dashboard' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Upload Document</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock monitoring_content %}
