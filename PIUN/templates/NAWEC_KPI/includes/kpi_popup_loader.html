<!-- KPI Popup Loader Block -->
<div id="kpi-popup-container">
    <!-- Dynamic KPI Popup will be loaded here -->
</div>

<script>
/**
 * KPI Popup Loader System
 * Dynamically generates popup HTML based on KPI type
 */
class KPIPopupLoader {
    constructor() {
        this.container = document.getElementById('kpi-popup-container');
    }

    /**
     * Generate popup HTML for specific KPI type
     */
    generatePopupHTML(config) {
        const popupId = `${config.type.toLowerCase()}-popup`;
        
        return `
        <div class="modal fade kpi-popup" id="${popupId}" tabindex="-1" aria-labelledby="${popupId}-label" aria-hidden="true">
            <div class="modal-dialog modal-dialog-responsive">
                <div class="modal-content">
                    <div class="modal-header" style="background: ${config.color}; color: white;">
                        <h5 class="modal-title" id="${popupId}-label">
                            <i class="bi bi-calculator"></i> ${config.title}
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-lg-7 col-md-12 mb-3">
                                <div class="input-section">
                                    <h6 class="text-muted mb-3"><i class="bi bi-pencil-square"></i> Input Values</h6>
                                    ${this.generateInputFields(config)}
                                </div>
                            </div>
                            <div class="col-lg-5 col-md-12">
                                <div class="formula-section">
                                    <h6 class="text-muted mb-3"><i class="bi bi-calculator"></i> Formula & Result</h6>
                                    <div class="alert alert-info mb-3">
                                        <strong>Formula:</strong><br>
                                        <code class="small">${config.formula}</code>
                                    </div>
                                    <div id="${config.type.toLowerCase()}-result" class="alert alert-success" style="display: none;">
                                        <strong>Calculated Value:</strong><br>
                                        <span class="fs-4 fw-bold" id="${config.type.toLowerCase()}-result-value">0</span>
                                        <span class="text-muted ms-1">${config.unit}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" onclick="resetKPIForm('${config.type}')">
                            <i class="bi bi-arrow-clockwise"></i> Reset
                        </button>
                        <button type="button" class="btn btn-primary" onclick="calculateKPI('${config.type}')">
                            <i class="bi bi-calculator"></i> Calculate
                        </button>
                        <button type="button" class="btn btn-success" id="${config.type.toLowerCase()}-use-btn" style="display: none;" onclick="useKPIResult('${config.type}')">
                            <i class="bi bi-check-circle"></i> Use Result
                        </button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="bi bi-x-circle"></i> Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>`;
    }

    /**
     * Generate input fields based on KPI configuration
     */
    generateInputFields(config) {
        let fieldsHTML = '';
        
        config.fields.forEach((field, index) => {
            if (field.type === 'select') {
                // Generate select dropdown
                fieldsHTML += `
                <div class="mb-3">
                    <label for="${config.type.toLowerCase()}-${field.name}" class="form-label">${field.label}</label>
                    <select class="form-control" id="${config.type.toLowerCase()}-${field.name}">
                        <option value="">Select ${field.label}</option>
                        ${field.options.map(option => `<option value="${option.value}">${option.text}</option>`).join('')}
                    </select>
                </div>`;
            } else {
                // Generate number input
                fieldsHTML += `
                <div class="mb-3">
                    <label for="${config.type.toLowerCase()}-${field.name}" class="form-label">${field.label}</label>
                    <div class="input-group">
                        <input type="number" 
                               class="form-control${field.readonly ? ' bg-light' : ''}" 
                               id="${config.type.toLowerCase()}-${field.name}" 
                               placeholder="${field.placeholder}"
                               step="${field.step || '0.01'}"
                               min="${field.min || '0'}"
                               ${field.max ? `max="${field.max}"` : ''}
                               ${field.readonly ? 'readonly style="background-color: #f8f9fa; color: #6c757d;"' : ''}>
                        ${field.unit ? `<span class="input-group-text">${field.unit}</span>` : ''}
                    </div>
                    ${field.description ? `<div class="form-text">${field.description}</div>` : ''}
                </div>`;
            }
        });

        return fieldsHTML;
    }

    /**
     * Load popup for specific KPI type
     */
    loadPopup(config) {
        console.log('Loading popup for config:', config);
        
        // Remove existing popup if any
        const existingPopup = document.querySelector('.kpi-popup');
        if (existingPopup) {
            existingPopup.remove();
        }

        // Generate and inject new popup HTML
        const popupHTML = this.generatePopupHTML(config);
        this.container.innerHTML = popupHTML;

        // Show the popup
        const popupElement = document.querySelector('.kpi-popup');
        const modal = new bootstrap.Modal(popupElement);
        modal.show();

        return modal;
    }
}

// Global popup loader instance
window.kpiPopupLoader = new KPIPopupLoader();

// Global helper functions for popup interactions
window.calculateKPI = function(kpiType) {
    if (window.kpiPopupManager) {
        window.kpiPopupManager.calculate(kpiType);
    }
};

window.resetKPIForm = function(kpiType) {
    if (window.kpiPopupManager) {
        window.kpiPopupManager.resetForm(kpiType);
    }
};

window.useKPIResult = function(kpiType) {
    if (window.kpiPopupManager) {
        window.kpiPopupManager.useResult(kpiType);
    }
};
</script>
