{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block head_title %}Comprehensive Integrated M&E Platform{% endblock %}</title>

    <!-- CSRF for HTMX -->
    <meta name="csrf-token" content="{{ csrf_token }}">

    <!-- Tailwind CSS (Primary Framework) -->
    <link href="{% static 'css/vendor/tailwind.min.css' %}" rel="stylesheet" />
    <!-- Tailwind Reset for Layout Fixes -->
    <link href="{% static 'css/tailwind-reset.css' %}" rel="stylesheet" />

    
    <!-- Bootstrap CSS (Secondary Support) -->
    <link href="{% static 'css/vendor/bootstrap.min.css' %}" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="{% static 'css/vendor/bootstrap-icons.css' %}" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="{% static 'css/vendor/fontawesome.min.css' %}" />

    <!-- HTMX -->
    <script src="{% static 'js/htmx.min.js' %}" defer></script>

    <!-- Custom CSS -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
    <!-- Text contrast for white backgrounds -->
    <link href="{% static 'css/text-contrast.css' %}" rel="stylesheet" />

    {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- Optional JS CSRF handler -->
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = document.querySelector('[name="csrf-token"]').content;
        });
    </script>

    {% block content %}
    {% endblock %}

    <!-- Bootstrap Bundle with Popper -->
    <script src="{% static 'js/vendor/bootstrap.bundle.min.js' %}"></script>
    <!-- jQuery -->
    <script src="{% static 'js/vendor/jquery-3.6.0.min.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
