{% load static %}
<nav class="bg-gray-800">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        <a href="{% url 'index' %}" class="flex items-center mr-auto">
            <img class="w-10 h-10" src="{% static 'image/NAWEC.JPG' %}" />
            <span class="self-center text-2xl font-semibold whitespace-nowrap ml-2">NAWEC</span>
        </a>
        
        <div class="flex items-center space-x-4">
            {% if user.is_authenticated %}
            <!-- User Info Section -->
            <div class="text-end">
                <span class="badge bg-success text-white px-2 py-1 rounded">{{ user.username }}</span>
                <p class="small text-gray-400 mb-0 text-xs">Last login: {{ user.last_login|date:"M d, Y H:i" }}</p>
            </div>
            {% endif %}
            
            <div class="md:block md:w-auto">
                <ul class="font-medium flex flex-row p-4 md:p-0 my-1 md:my-2 rounded-lg md:flex-row md:space-x-8">
                    {% if user.is_authenticated %}
                    <li>
                        <a href="{% url 'account_logout' %}" class="block py-2 pl-3 pr-4 text-white rounded md:p-0" aria-current="page">
                            Logout
                        </a>
                    </li>
                    {% if user.is_staff %}
                    <li>
                        <a href="{% url 'account_signup' %}" class="block py-2 pl-3 pr-4 text-white rounded md:p-0" aria-current="page">
                            Sign Up
                        </a>
                    </li>
                    {% endif %}
                    {% else %}
                    <li>
                        <a href="{% url 'account_login' %}" class="block py-2 pl-3 pr-4 text-white rounded md:p-0" aria-current="page">
                            Login
                        </a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </div>
</nav>
