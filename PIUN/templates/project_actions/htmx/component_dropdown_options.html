<option value="">---------</option>
{% for component in components %}
    <option value="{{ component.compID }}" 
            hx-get="{% url 'project_actions:load_component_subcomponents' %}" 
            hx-target="#id_subcompID" 
            hx-trigger="click">
        {{ component.project_components }}
    </option>
{% endfor %}
{% if not components %}
    <option value="" disabled>No components available</option>
{% endif %}
