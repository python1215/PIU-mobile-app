<div id="contributor-block">
    <div class="flex justify-between items-center mt-4 mb-6">
        <h1 class="mt-8 mb-4 prose prose-2xl text-red">
            contributor List
        </h1>
        <!-- Add contributor Button -->
        <a hx-get="{% url 'add-contributor' %}"
           hx-push-url="true"
           hx-target="#contributor-block"
           class="cursor-pointer text-green-600 hover:text-green-700">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            Add contributor
        </a>
    </div>

    <div class="overflow-x-auto text-black">
        {% if contributors %}
        <table class="table table-zebra table-pin-rows w-full bg-white rounded-lg shadow-md">
            <!-- Table Header -->
            <thead class="text-sm text-black uppercase bg-gray-200">
                <tr>
                    <th class="px-6 py-3">contriID</th>
                    <th class="px-6 py-3">Name</th>
                    <th class="px-6 py-3">Date Created</th>
                    <th class="px-6 py-3">User</th>
                    <th class="px-6 py-3">Action</th>
                </tr>
            </thead>
            <!-- Table Body -->
            <tbody>
                {% for contributor in contributors %}
                <tr class="hover:bg-gray-100">
                    <td class="px-6 py-4">{{ contributor.contriID }}</td>
                    <td class="px-6 py-4">{{ contributor.name }}</td>
                    <td class="px-6 py-4">{{ contributor.date }}</td>
                    <td class="px-6 py-4">{{ contributor.loginUser }}</td>
                    <td class="px-6 py-4">
                        <div class="join">
                            <!-- Edit button -->
                            <a hx-get="{% url 'update-contributor' contributor.pk %}"
                               hx-push-url="true"
                               hx-target="#contributor-block"
                               class="btn btn-ghost btn-xs join-item text-black" 
                               title="Edit">                                   
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 mr-1">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                                </svg>
                            </a>
                       
                            <!-- Delete button -->
                            <button hx-delete="{% url 'delete-contributor' pk=contributor.pk %}"
                                   hx-target="#contributor-block"
                                   hx-confirm="Are you sure you want to delete this contributor?"
                                   class="btn btn-ghost btn-xs join-item text-black" 
                                   title="Delete">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="text-2xl text-black text-center mt-4">
            No contributor found
        </p>
        {% endif %}
    </div>
</div>
