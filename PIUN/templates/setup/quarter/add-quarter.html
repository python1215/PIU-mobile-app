{% load widget_tweaks %}


{% block content %}


<form hx-post="{% url 'add-quarter' %}" 
     
      class="space-y-4">
    {% csrf_token %}
    {% include 'setup/quarter/quarter_form.html' %}
    
    <!-- Buttons for Save and Cancel -->
    <div class="flex justify-end space-x-4 mt-6">
        <button type="submit" 
                class="px-6 py-2 bg-green-600 text-white hover:bg-green-700 rounded">
            Save
        </button>
        <button type="button" 
                class="px-6 py-2 bg-gray-600 text-white hover:bg-gray-700 rounded" 
                onclick="window.history.back();">
            Cancel
        </button>
    </div>
</form>
{% endblock %}
