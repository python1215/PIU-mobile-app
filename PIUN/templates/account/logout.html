{% extends "base.html" %}
{% load i18n %}

{% block head_title %}{% trans "Sign Out" %}{% endblock %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100">
  <div class="row w-100 justify-content-center">
    <div class="col-md-6 col-lg-4 col-xl-3">
      <div class="card shadow-lg border-0">
        <div class="card-header text-center bg-danger text-white">
          <h3 class="mb-0">{% trans "Sign Out" %}</h3>
        </div>
        <div class="card-body p-4 text-center">
          <p class="mb-4">{% trans 'Are you sure you want to sign out?' %}</p>
          
          <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            
            {% if redirect_field_value %}
              <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
            {% endif %}
            
            <div class="d-grid gap-2">
              <button class="btn btn-danger btn-lg" type="submit">{% trans 'Sign Out' %}</button>
              <a href="{% url 'main_dashboard' %}" class="btn btn-outline-secondary">{% trans 'Cancel' %}</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
