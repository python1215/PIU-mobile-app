# Server Configuration
server.port=8080

# Database Configuration - Handled by DatabaseConfig.java
# spring.datasource.url is configured programmatically to handle DATABASE_URL format

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-jwt-authentication-must-be-at-least-32-bytes}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5000,https://*.replit.dev,https://*.replit.app

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.root=INFO
logging.level.com.piun=DEBUG
