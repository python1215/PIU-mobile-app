name: Expo Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Expo doctor
        run: npx expo-doctor

      - name: Validate Expo config
        run: npx expo config --type public > /tmp/expo-config.json

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist --clear