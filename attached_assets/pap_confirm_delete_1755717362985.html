{% extends "social_and_env/base.html" %}

{% block title %}Confirm Delete - {{ pap.pap_name }}{% endblock %}

{% block social_env_content %}
<div class="container mt-4">
    <h2>Confirm Deletion</h2>
    <p>Are you sure you want to delete the PAP record for <strong>{{ pap.pap_name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'pap_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
